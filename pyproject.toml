[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premium-car-deal-radar"
version = "0.1.0"
description = "India-wide premium used/demo car crawler and deal detector"
requires-python = ">=3.11,<3.14"
# Keep the core package dependency-free so lightweight Vercel Python functions
# do not inherit the crawler/browser/data-science dependency tree. The scheduled
# crawler installs requirements-crawler.txt explicitly.
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
agent = ["browser-use==0.13.10"]

test = ["pytest>=8,<9", "responses>=0.25,<1"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "e2e: browser end-to-end dashboard tests",
]