[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premium-car-deal-radar"
version = "0.1.0"
description = "India-wide premium used/demo car crawler and deal detector"
requires-python = ">=3.11,<3.14"
# Keep core dependencies small so lightweight Vercel Python functions
# do not inherit the crawler/browser/data-science dependency tree. The scheduled
# production refresh worker uses requirements.txt; only explicit legacy browser
# reporting installs requirements-crawler.txt.
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
agent = ["browser-use==0.13.10"]

test = ["pytest>=8,<9", "responses>=0.25,<1"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "e2e: browser end-to-end dashboard tests",
  "integration: real PostgreSQL tests using a disposable localhost database",
]
