# Canonical source registry for acquisition + source planning.
# adapter_status: live = currently wired into the customer live-search path;
# candidate = known source, not yet wired to live search;
# discovery_only = tracked for discovery/research, not directly crawled yet.
# conditions describe the inventory segment the source is intended to cover.
# segments are product segments, not customer-facing filters.

known_sources:
- name: CarDekho Used
  url: https://www.cardekho.com/usedCars/
  catalog_url: https://www.cardekho.com/newcars
  catalog_exclude_paths: [compare-cars, electric-cars]
  tier: 1
  source_type: marketplace
  adapter_status: live
  geography: india
  conditions: [used]
  segments: [mass_market, premium, luxury]
  brands: [all]
  priority: 90
  query_strategy: brand_model
