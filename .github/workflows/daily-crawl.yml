name: Premium Car Deal Radar

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium
          crawl4ai-setup
      - name: Run tests
        run: pytest -q
      - name: Run crawler
        run: python -m src.main --config config/settings.yaml --sources config/sources.yaml
      - name: Commit crawler output
        run: |
          git config user.name 'premium-car-deal-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'chore: daily premium car crawl'
            git push origin premium-car-deal-radar
          fi
