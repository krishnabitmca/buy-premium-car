name: Controlled Scan Ledger Verification

on:
  workflow_dispatch:
    inputs:
      source_name:
        description: Existing enabled verified source name
        required: true
        type: string
      brand:
        description: Optional existing queued make scope
        required: false
        type: string
      capture_sample:
        description: Capture bounded historical samples (reviewed Fusion only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: carscanner-inventory-refresh
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify one accepted acquisition batch
        env:
          SOURCE_INTELLIGENCE_DATABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_DATABASE_URL }}
          CARSCANNER_SCAN_LEDGER_ENABLED: 'true'
          CARSCANNER_MAX_PAGES_PER_SOURCE: '1'
          CARSCANNER_QUERY_DISCOVERY: 'false'
          SOURCE_NAME: ${{ inputs.source_name }}
          BRAND: ${{ inputs.brand }}
          CARSCANNER_PARSER_CAPTURE_ENABLED: ${{ inputs.capture_sample && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(--source "$SOURCE_NAME" --brand "$BRAND")
          if [[ "$CARSCANNER_PARSER_CAPTURE_ENABLED" == "true" ]]; then
            mkdir -p parser-evidence
            args+=(--capture-directory parser-evidence/controlled-batch)
          fi
          python -m scripts.verify_scan_ledger "${args[@]}" | tee verification-status.json
      - name: Retain bounded sanitized evidence
        if: always() && inputs.capture_sample
        uses: actions/upload-artifact@v4
        with:
          name: controlled-parser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            parser-evidence/controlled-batch/sample-*.json
            parser-evidence/controlled-batch/receipt.json
            verification-status.json
