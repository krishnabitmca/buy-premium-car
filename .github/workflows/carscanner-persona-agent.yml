name: CarScanner Persona Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  persona:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all-dropdown buyer persona
        run: python tests/persona_agent.py
