name: Inventory Refresh Scheduler

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum demand intents to schedule"
        required: false
        default: "10"

concurrency:
  group: carscanner-inventory-refresh
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Schedule refresh work
        env:
          SOURCE_INTELLIGENCE_DATABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_DATABASE_URL || secrets.SOURCE_INTELLIGENCE_DATABASE_URL }}
        run: |
          python -m src.source_runtime_config --all-existing --apply
          python -m src.inventory_refresh_planner --limit "${{ inputs.limit || '10' }}"
      - name: Process refresh work
        env:
          SOURCE_INTELLIGENCE_DATABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_DATABASE_URL || secrets.SOURCE_INTELLIGENCE_DATABASE_URL }}
          CARSCANNER_MAX_PAGES_PER_SOURCE: "3"
        run: |
          failed=0
          python -m src.inventory_refresh_worker --limit 1 || failed=1
          python -m src.inventory_refresh_worker --demo-only --limit 1 || failed=1
          python -m src.inventory_refresh_worker --catalogues-only --limit 4 || failed=1
          python -m src.inventory_refresh_worker --models-only --limit 2 || failed=1
          python -m src.inventory_refresh_worker --continuations-only --limit 2 || failed=1
          exit "$failed"
      - name: Renew existing listings and expire stale offers
        if: always()
        env:
          SOURCE_INTELLIGENCE_DATABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_DATABASE_URL || secrets.SOURCE_INTELLIGENCE_DATABASE_URL }}
        run: python -m src.inventory_lifecycle --limit 10 --report coverage/inventory-lifecycle.json
      - name: Upload inventory lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-lifecycle-${{ github.run_number }}
          path: coverage/inventory-lifecycle.json
          if-no-files-found: error
          retention-days: 14
      - name: Measure coverage gaps and worker capacity
        if: always()
        env:
          SOURCE_INTELLIGENCE_DATABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_DATABASE_URL || secrets.SOURCE_INTELLIGENCE_DATABASE_URL }}
        run: python -m src.inventory_coverage --operations-only --output coverage/operations.json --markdown coverage/operations.md
      - name: Upload coverage operations evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-operations-${{ github.run_number }}
          path: |
            coverage/operations.json
            coverage/operations.md
          if-no-files-found: error
          retention-days: 14
      - name: Refresh derived Elasticsearch inventory
        if: always()
        env:
          SOURCE_INTELLIGENCE_DATABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_DATABASE_URL || secrets.SOURCE_INTELLIGENCE_DATABASE_URL }}
          CARSCANNER_ELASTICSEARCH_URL: https://my-elasticsearch-project-e2727c.es.us-east4.gcp.elastic.cloud
          CARSCANNER_ELASTICSEARCH_INDEXER_API_KEY: ${{ secrets.CARSCANNER_ELASTICSEARCH_INDEXER_API_KEY }}
        run: |
          if [ -n "$CARSCANNER_ELASTICSEARCH_INDEXER_API_KEY" ]; then
            python -m src.elastic_inventory
          else
            echo 'Elasticsearch indexing is not configured; PostgreSQL remains authoritative.'
          fi
      - name: Process instant car watches
        env:
          SOURCE_INTELLIGENCE_DATABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_DATABASE_URL || secrets.SOURCE_INTELLIGENCE_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CARSCANNER_FREE_TEST_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_GRAPH_VERSION: ${{ secrets.WHATSAPP_GRAPH_VERSION }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            python -m scripts.process_alerts --mode instant --dry-run
          else
            echo 'Instant alerts disabled: watch database API credentials are not configured.'
          fi
