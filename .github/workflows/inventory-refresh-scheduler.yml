name: Inventory Refresh Scheduler

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum demand intents to schedule"
        required: false
        default: "100"

concurrency:
  group: carscanner-inventory-refresh
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Schedule refresh work
        env:
          CARSCANNER_DATABASE_URL: ${{ secrets.SOURCE_INTELLIGENCE_DATABASE_URL }}
        run: python -m src.inventory_refresh_planner --limit "${{ inputs.limit || '100' }}"
