name: Inventory Refresh Scheduler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum demand intents to schedule"
        required: false
        default: "10"

concurrency:
  group: carscanner-inventory-refresh
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Schedule refresh work
        env:
          SOURCE_INTELLIGENCE_DATABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_DATABASE_URL || secrets.SOURCE_INTELLIGENCE_DATABASE_URL }}
        run: python -m src.inventory_refresh_planner --limit "${{ inputs.limit || '10' }}"
      - name: Process refresh work
        env:
          SOURCE_INTELLIGENCE_DATABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_DATABASE_URL || secrets.SOURCE_INTELLIGENCE_DATABASE_URL }}
          CARSCANNER_MAX_PAGES_PER_SOURCE: "3"
        run: |
          for i in 1; do
            python -m src.inventory_refresh_worker --limit "10" || exit 1
          done
      - name: Process instant car watches
        env:
          SOURCE_INTELLIGENCE_DATABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_DATABASE_URL || secrets.SOURCE_INTELLIGENCE_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CARSCANNER_FREE_TEST_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_GRAPH_VERSION: ${{ secrets.WHATSAPP_GRAPH_VERSION }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            python -m scripts.process_alerts --mode instant --dry-run
          else
            echo 'Instant alerts disabled: watch database API credentials are not configured.'
          fi
