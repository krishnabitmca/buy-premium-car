name: CarScanner Verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
      - 'qa/**'

concurrency:
  group: carscanner-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-planner dependency
        run: python -m pip install PyYAML beautifulsoup4
      - name: Python syntax checks
        run: python -m py_compile api/search.py api/catalog.py src/live_marketplaces.py src/source_adapters.py src/inventory_refresh_worker.py src/used_inventory_frontier.py
      - name: Parser diagnostic security regression tests
        run: python -m unittest -v tests.test_source_diagnostic_sanitization
      - name: Parser smoke tests
        run: python tests/test_live_marketplaces.py
      - name: Comprehensive QA tests
        run: python -m unittest -v tests.test_qa_comprehensive
      - name: Worker diagnostics artifact safety tests
        run: python -m unittest -v tests.test_worker_diagnostics
      - name: Ingestion contention regression tests
        run: python -m unittest -v tests.test_ingestion_lock_contention
      - name: Install matching Playwright Python package
        timeout-minutes: 5
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: python -m pip install --disable-pip-version-check 'playwright==1.55.0'
      - name: Adversarial browser E2E test
        run: |
          python -m http.server 4173 --directory . >/tmp/carscanner-http.log 2>&1 &
          python tests/ui_qa_e2e.py
      - name: Browser smoke test
        run: |
          python -m http.server 4173 --directory . >/tmp/carscanner-http.log 2>&1 &
          python tests/ui_smoke.py

      - name: Exhaustive sidebar filter matrix
        run: |
          python -m http.server 4173 --directory . >/tmp/carscanner-http.log 2>&1 &
          python tests/ui_filter_matrix_e2e.py
