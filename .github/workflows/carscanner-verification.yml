name: CarScanner Verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax checks
        run: python -m py_compile api/search.py api/catalog.py src/live_marketplaces.py
      - name: Parser smoke tests
        run: python tests/test_live_marketplaces.py
      - name: Comprehensive QA tests
        run: python -m unittest -v tests.test_qa_comprehensive
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Adversarial browser E2E test
        run: |
          python -m http.server 4173 --directory . >/tmp/carscanner-http.log 2>&1 &
          python tests/ui_qa_e2e.py
      - name: Browser smoke test
        run: |
          python -m http.server 4173 --directory . >/tmp/carscanner-http.log 2>&1 &
          python tests/ui_smoke.py
