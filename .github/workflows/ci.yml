name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: carscanner-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<9" beautifulsoup4 PyYAML ddgs
      - run: pytest -q -m "not e2e and not integration"
        env:
          # Unit tests must never perform open-web discovery. Dedicated discovery
          # contract tests mock the web boundary; preview/runtime validation tests the real web.
          CARSCANNER_QUERY_DISCOVERY: "false"

  inventory-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: carscanner_test
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carscanner_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt "pytest>=8,<9"
      - run: pytest -q -o faulthandler_timeout=30 -m integration tests/test_inventory_postgres.py tests/test_shared_metadata_cache.py tests/test_scan_ledger_postgres.py tests/test_scan_ledger_retention_postgres.py tests/test_scan_ledger_access_postgres.py
        env:
          CARSCANNER_TEST_DATABASE_URL: postgresql://carscanner_test:local-test-password@127.0.0.1:5432/postgres
          CARSCANNER_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          CARSCANNER_QUERY_DISCOVERY: "false"
          PGOPTIONS: "-c statement_timeout=30000 -c lock_timeout=5000"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<9" playwright beautifulsoup4 PyYAML ddgs
          python -m playwright install --with-deps chromium
      - run: pytest -q -m e2e
