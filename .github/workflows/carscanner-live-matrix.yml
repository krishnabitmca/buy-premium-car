name: CarScanner Live Catalog Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  live-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all-brand all-model live matrix
        run: |
          python tests/live_catalog_matrix.py | tee live-catalog-matrix.json
      - name: Upload matrix report
        uses: actions/upload-artifact@v4
        with:
          name: carscanner-live-catalog-matrix
          path: live-catalog-matrix.json
