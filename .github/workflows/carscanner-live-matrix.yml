name: CarScanner Live Catalog Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  live-matrix:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run all-brand all-model live matrix
        run: |
          set -o pipefail
          CARSCANNER_MATRIX_SHARDS=4 CARSCANNER_MATRIX_SHARD=${{ matrix.shard }} PYTHONUNBUFFERED=1 PYTHONPATH=. timeout --signal=TERM --kill-after=20s 38m python tests/live_catalog_matrix.py | tee live-catalog-matrix.json
          test -s live-catalog-matrix.json
      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carscanner-live-catalog-matrix-shard-${{ matrix.shard }}
          path: live-catalog-matrix.json
