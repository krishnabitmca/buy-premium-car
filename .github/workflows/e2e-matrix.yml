name: CarScanner E2E Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: carscanner-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run CarScanner E2E matrix
        run: |
          pytest -q tests/test_e2e_matrix.py
      - name: Run customer journey browser contract
        env:
          CARSCANNER_BASE_URL: https://buy-premium-car1.onrender.com/
        run: |
          EXPECTED_DEPLOYMENT_SHA="${{ github.event_name == 'push' && github.sha || '' }}" python scripts/wait_for_deployment.py
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node tests/browser_customer_journey.js

  production-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run production synthetic journeys
        env:
          CARSCANNER_BASE_URL: https://buy-premium-car1.onrender.com/
        run: python scripts/production_e2e.py

  qa-agent:
    # Use the pinned Playwright image with Chromium and system libraries already installed.
    # This removes the slow, unreliable install-deps / browser download gate.
    # Preview access is limited to branches in this repository, never fork code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request'
        with:
          python-version: "3.12"
      - name: Start branch preview against approved test inventory
        if: github.event_name == 'pull_request'
        env:
          SOURCE_INTELLIGENCE_DATABASE_URL: ${{ secrets.CARSCANNER_FREE_TEST_DATABASE_URL }}
          CARSCANNER_INVENTORY_FIRST: 'true'
          CARSCANNER_ALLOW_LIVE_COVERAGE_FALLBACK: 'false'
          HOST: '127.0.0.1'
          PORT: '8000'
        run: |
          test -n "$SOURCE_INTELLIGENCE_DATABASE_URL"
          python -m ensurepip --upgrade
          python -m pip install -r requirements.txt
          python -m gunicorn --config gunicorn.conf.py wsgi:application > /tmp/carscanner-preview.log 2>&1 &
      - name: Install pinned browser test package
        timeout-minutes: 3
        run: |
          set -euxo pipefail
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          node -e "const {chromium}=require('playwright'); console.log(chromium.executablePath())"
      - name: Run comprehensive customer journey QA
        env:
          CARSCANNER_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8000/' || 'https://buy-premium-car1.onrender.com/' }}
          QA_REPORT_DIR: qa-reports
        run: |
          EXPECTED_DEPLOYMENT_SHA="${{ github.event_name == 'push' && github.sha || '' }}" python3 scripts/wait_for_deployment.py
          node tests/qa_customer_journey.js
      - name: Upload QA report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carscanner-qa-report-${{ github.run_number }}
          path: qa-reports/
          if-no-files-found: warn
