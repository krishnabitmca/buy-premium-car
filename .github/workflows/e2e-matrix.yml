name: CarScanner E2E Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: carscanner-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run CarScanner E2E matrix
        run: |
          pytest -q tests/test_e2e_matrix.py
      - name: Run customer journey browser contract
        env:
          CARSCANNER_BASE_URL: https://buy-premium-gei7zovun-premium-car-deal-radar.vercel.app/
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node tests/browser_customer_journey.js

  production-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run production synthetic journeys
        env:
          CARSCANNER_BASE_URL: https://buy-premium-gei7zovun-premium-car-deal-radar.vercel.app/
        run: python scripts/production_e2e.py

  qa-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run comprehensive customer journey QA
        env:
          CARSCANNER_BASE_URL: https://buy-premium-gei7zovun-premium-car-deal-radar.vercel.app/
          QA_REPORT_DIR: qa-reports
        run: node tests/qa_customer_journey.js
      - name: Upload QA report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carscanner-qa-report-${{ github.run_number }}
          path: qa-reports/
          if-no-files-found: warn
